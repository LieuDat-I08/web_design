<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Đăng nhập</title>
    </head>
    <body>
        <form action="/register" method="post" enctype="multipart/form-data">
            <table align="center" border="2" cellspacing="0" width="25%">
                <tr>
                    <td>
                        <h3 align="center">ĐĂNG NHẬP DIỄN ĐÀN</h3>
                        <br>
                        <label for="tendangnhap">Tên đăng nhập:</label>
                        <input type="text" id="tendangnhap" name="tên đăng nhập" required>
                        <br><br>
                        <label for="password">Mật khẩu:</label>
                        <input type="password" id="password" name="password" required>
                        <br><br>
                        <button type="submit">Đăng nhập</button>
                        <button type="reset">Phục hồi</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
